# MCP tool definitions. Tools are opt-in: an operation is exposed only when it has an entry here.
# List operations without an entry: pnpm --filter=@posthog/mcp run scaffold-yaml -- --candidates --product cloud_agents
# Add one: pnpm --filter=@posthog/mcp run scaffold-yaml -- --add <operationId> --product cloud_agents
# To keep an operation off on purpose, set enabled: false and give a disabled_reason.
category: Cloud agents
feature: cloud_agents
url_prefix: /cloud-agents
tools:
    cloud-agents-catalog:
        operation: cloud_agents_catalog_retrieve
        enabled: true
        scopes:
            - cloud_agent:read
        annotations:
            readOnly: true
            destructive: false
            idempotent: true
        title: Get cloud agents catalog
        description: >
            Get what a cloud agent run can use in this project: the sandbox sizes with their price per hour, the model
            IDs, the inference modes, the compute rates, and the project limits (concurrent runs and runs started per
            hour). Use it before cloud-agents-run-create to pick a valid `size` or `model`, or to answer a pricing
            question. The prices here are the source of truth.
        feature_flag: cloud-agents
        feature_flag_behavior: enable
    cloud-agents-estimate:
        operation: cloud_agents_estimate_retrieve
        enabled: true
        scopes:
            - cloud_agent:read
        annotations:
            readOnly: true
            destructive: false
            idempotent: true
        title: Estimate cloud agent compute cost
        description: >
            Estimate the compute cost of one sandbox size for a number of minutes. It starts nothing and costs nothing.
            The estimate covers compute only. Model usage is not included, and a run is billed for the seconds it
            really uses. Use cloud-agents-catalog to see the sizes.
        feature_flag: cloud-agents
        feature_flag_behavior: enable
    cloud-agents-profile-create:
        operation: cloud_agents_profiles_create
        enabled: true
        scopes:
            - cloud_agent:write
        annotations:
            readOnly: false
            destructive: false
            idempotent: false
        enrich_url: 'profiles/{id}'
        title: Create cloud agent profile
        description: >
            Create a profile: a named set of run defaults such as repository, branch, model, size, inference mode,
            instructions and tags. A run that names the profile uses these defaults, so later runs need only a prompt.
            Only `name` is required, and the name must be unique in the project. Creating a profile starts no run and
            costs nothing. A value sent on a run overrides the profile value for that run.
        exclude_params:
            - pr_mode
            - max_duration_minutes
            - max_cost_usd
        feature_flag: cloud-agents
        feature_flag_behavior: enable
    cloud-agents-profile-get:
        operation: cloud_agents_profiles_retrieve
        enabled: true
        scopes:
            - cloud_agent:read
        annotations:
            readOnly: true
            destructive: false
            idempotent: true
        enrich_url: 'profiles/{id}'
        title: Get cloud agent profile
        description: >
            Get one profile by ID, with all the run defaults it sets. A null field sets no default. Use
            cloud-agents-profile-list to find the ID.
        param_overrides:
            id:
                description: ID of the profile (a UUID). A profile name is not accepted here.
        feature_flag: cloud-agents
        feature_flag_behavior: enable
    cloud-agents-profile-list:
        operation: cloud_agents_profiles_list
        enabled: true
        scopes:
            - cloud_agent:read
        annotations:
            readOnly: true
            destructive: false
            idempotent: true
        list: true
        enrich_url: 'profiles/{id}'
        title: List cloud agent profiles
        description: >
            List the profiles of the project. A profile is a named set of run defaults. Use it to find a profile to
            pass as `profile` to cloud-agents-run-create, by ID or by name.
        response:
            exclude:
                - instructions
                - pr_mode
                - max_duration_minutes
                - max_cost_usd
                - created_by
        feature_flag: cloud-agents
        feature_flag_behavior: enable
    cloud-agents-run-cancel:
        operation: cloud_agents_runs_cancel_create
        enabled: true
        scopes:
            - cloud_agent:write
        annotations:
            readOnly: false
            destructive: true
            idempotent: true
        title: Cancel cloud agent run
        description: >
            Ask a run to stop. The agent stops in the middle of its work, and compute billing ends when the sandbox
            stops. The run can stay `running` for a short time, so read it again with cloud-agents-run-get until the
            status is `cancelled`. A run that already stopped is returned unchanged. A cancelled run can continue
            later with cloud-agents-run-message.
        param_overrides:
            id:
                description: ID of the run to cancel (a UUID).
        response:
            include:
                - id
                - status
                - stop_reason
                - error
                - completed_at
                - result
                - cost
        feature_flag: cloud-agents
        feature_flag_behavior: enable
    cloud-agents-run-create:
        operation: cloud_agents_runs_create
        enabled: true
        scopes:
            - cloud_agent:write
        annotations:
            readOnly: false
            destructive: false
            idempotent: false
        enrich_url: 'runs/{id}'
        title: Start cloud agent run
        description: >
            Start a cloud agent run: a cloud sandbox runs a coding agent on your prompt in a GitHub repository and, by
            default, opens a pull request. This starts a billed sandbox. Compute is billed per second for the selected
            size until the run stops, and model usage is billed according to the inference mode. Only start a run when
            the user asked for one. The shortest call is `prompt` plus `profile` (a profile ID or name that holds the
            repository and the other defaults). Without a profile, send `prompt` and `repository`. The call returns at
            once with a `queued` run. Keep the `id`, then poll cloud-agents-run-get until the status is `completed`,
            `failed` or `cancelled`. This tool cannot send an idempotency key, so every call starts a new run. Do not
            call it again after a timeout or an unclear error: first check cloud-agents-run-list for the run. A 429
            error means the project is at its concurrency, rate or usage limit, so wait before you try again.
        param_overrides:
            prompt:
                description: >
                    The task for the agent, in plain language. Say what to change and how to know it is done. The agent
                    sees only this text, the instructions, and the repository.
            size:
                description: >
                    Sandbox size, as `<vCPU>x<memory in GiB>`. A larger size costs more per second. Leave it out to use
                    the default of the profile or the project. See cloud-agents-catalog for prices.
            model:
                description: >
                    Model ID from cloud-agents-catalog. Leave it out to use the default of the profile or the project.
        exclude_params:
            - pr_mode
            - max_duration_minutes
            - max_cost_usd
        response:
            include:
                - id
                - status
                - created_at
                - repository
                - branch
                - profile
                - config.model
                - config.size
                - config.inference
                - config.create_pr
                - tags
        feature_flag: cloud-agents
        feature_flag_behavior: enable
    cloud-agents-run-events:
        operation: cloud_agents_runs_events_retrieve
        enabled: false
        disabled_reason: >
            The endpoint answers a request that has no Accept header with a live event stream, and a generated tool
            can send neither that header nor the `format` query parameter, so the call would not return. Enable it when
            the tool can request JSON.
        scopes:
            - cloud_agent:read
        annotations:
            readOnly: true
            destructive: false
            idempotent: true
        title: Get cloud agent run events
        description: >
            Get the stored events of a run as JSON, oldest first, across all its agent sessions. Each event is one
            message of the agent protocol with the time it was recorded: prompts, agent text, tool calls and their
            results. Use it to see what the agent did or why a run failed. The response can be very large for a long
            run, so use cloud-agents-run-get when you need only the status, the result or the cost. `truncated` is true
            when the log was too large to return in full.
        param_overrides:
            id:
                description: ID of the run (a UUID).
        exclude_params:
            - start
        feature_flag: cloud-agents
        feature_flag_behavior: enable
    cloud-agents-run-get:
        operation: cloud_agents_runs_retrieve
        enabled: true
        scopes:
            - cloud_agent:read
        annotations:
            readOnly: true
            destructive: false
            idempotent: true
        enrich_url: 'runs/{id}'
        title: Get cloud agent run
        description: >
            Get one run by ID: its status, stop reason, error, configuration, pull request URLs, summary and cost. Use
            it to poll a run after cloud-agents-run-create. `queued` and `running` are active. `completed`, `failed` and
            `cancelled` mean the run stopped, and `stop_reason` says why. `result.pr_url` is the pull request and
            `result.summary` is the agent's own summary. `cost.final` is false while the cost can still change. Poll
            every 15 to 30 seconds, not faster.
        param_overrides:
            id:
                description: ID of the run (a UUID).
        feature_flag: cloud-agents
        feature_flag_behavior: enable
    cloud-agents-run-list:
        operation: cloud_agents_runs_list
        enabled: true
        scopes:
            - cloud_agent:read
        annotations:
            readOnly: true
            destructive: false
            idempotent: true
        list: true
        enrich_url: 'runs/{id}'
        title: List cloud agent runs
        description: >
            List the runs of the project, newest first. Filter by `status`, `profile_id`, `repository`, `tag`, or a
            creation time range. Each row is a short form of the run. Use cloud-agents-run-get for the configuration,
            the agent sessions and the full cost of one run.
        response:
            include:
                - id
                - status
                - stop_reason
                - error
                - created_at
                - completed_at
                - prompt
                - repository
                - branch
                - profile
                - result.pr_url
                - cost.total_usd
                - cost.final
                - tags
        feature_flag: cloud-agents
        feature_flag_behavior: enable
    cloud-agents-run-message:
        operation: cloud_agents_runs_messages_create
        enabled: true
        scopes:
            - cloud_agent:write
        annotations:
            readOnly: false
            destructive: false
            idempotent: false
        title: Send message to cloud agent run
        description: >
            Send a follow-up message to a run. A running agent gets the message in its current session. A run that
            stopped starts a new agent session with the message, which starts a billed sandbox again and moves the run
            back to `queued`. `resumed` in the response says which of the two happened. Use it to ask for changes to
            the pull request or to continue a failed, timed out or cancelled run in the same repository state. A run
            that uses the model credential of the user who started it accepts messages from that user only. Each call
            sends one more message, so do not repeat a call that may have succeeded.
        param_overrides:
            id:
                description: ID of the run to send the message to (a UUID).
        response:
            include:
                - resumed
                - run.id
                - run.status
                - run.stop_reason
                - run.agent_sessions
        feature_flag: cloud-agents
        feature_flag_behavior: enable
    cloud-agents-run-usage:
        operation: cloud_agents_runs_usage_retrieve
        enabled: true
        scopes:
            - cloud_agent:read
        annotations:
            readOnly: true
            destructive: false
            idempotent: true
        title: Get cloud agent run usage
        description: >
            Get the cost of one run up to now, with each sandbox that the run used: its size, start and end time,
            billed seconds and compute cost. `waived` is true for a sandbox that PostHog did not bill. Use it to explain
            the cost of a run. cloud-agents-run-get already has the cost totals.
        param_overrides:
            id:
                description: ID of the run (a UUID).
        feature_flag: cloud-agents
        feature_flag_behavior: enable
    cloud-agents-usage-summary:
        operation: cloud_agents_usage_retrieve
        enabled: true
        scopes:
            - cloud_agent:read
        annotations:
            readOnly: true
            destructive: false
            idempotent: true
        title: Get cloud agents usage summary
        description: >
            Get cost and usage totals for the runs created in a date range, with one bucket for each UTC day or for
            each profile. The default range is the last 30 days and the longest range is 366 days. Use it for spend
            questions across many runs. Use cloud-agents-run-usage for one run.
        feature_flag: cloud-agents
        feature_flag_behavior: enable
    # Project configuration and webhook secrets stay with a person in the app or the REST API.
    cloud-agents-profile-delete:
        operation: cloud_agents_profiles_destroy
        enabled: false
        disabled_reason: Deleting a shared profile changes what later runs of other people use, so a person does it.
    cloud-agents-profile-update:
        operation: cloud_agents_profiles_partial_update
        enabled: false
        disabled_reason: Changing a shared profile changes what later runs of other people use, so a person does it.
    cloud-agents-settings-update:
        operation: cloud_agents_settings_partial_update
        enabled: false
        disabled_reason: Project defaults apply to every run of the project, so a person changes them.
    cloud-agents-webhook-endpoint-create:
        operation: cloud_agents_webhook_endpoints_create
        enabled: false
        disabled_reason: A webhook endpoint sends run data to an external URL, so a person sets it up.
    cloud-agents-webhook-endpoint-delete:
        operation: cloud_agents_webhook_endpoints_destroy
        enabled: false
        disabled_reason: Webhook endpoints are project configuration that a person manages.
    cloud-agents-webhook-endpoint-update:
        operation: cloud_agents_webhook_endpoints_partial_update
        enabled: false
        disabled_reason: A webhook endpoint sends run data to an external URL, so a person changes it.
    cloud-agents-webhook-secret-create:
        operation: cloud_agents_webhook_endpoints_secret_create
        enabled: false
        disabled_reason: The response carries the webhook signing secret, which must not enter an agent conversation.
    cloud-agents-webhook-secret-rotate:
        operation: cloud_agents_webhook_endpoints_rotate_secret_create
        enabled: false
        disabled_reason: The response carries the webhook signing secret, and a rotation breaks every receiver at once.
